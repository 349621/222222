<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>量化交易面板</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', monospace; background: #0a0e27; color: #e0e0e0; padding: 20px; }
        .dashboard { max-width: 1600px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { color: #00d4aa; font-size: 24px; }
        .status-badge { padding: 5px 12px; border-radius: 20px; font-size: 12px; }
        .running { background: #00d4aa20; color: #00d4aa; border: 1px solid #00d4aa; }
        .paused { background: #ff475720; color: #ff4757; border: 1px solid #ff4757; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .card { background: #141832; border-radius: 12px; padding: 16px; border: 1px solid #2a2f4e; }
        .card h3 { margin-bottom: 12px; color: #7c8bdb; font-size: 14px; letter-spacing: 1px; }
        .metric { font-size: 28px; font-weight: bold; color: #00d4aa; }
        .metric-label { font-size: 12px; color: #8b92b0; margin-top: 4px; }
        .signal-list { max-height: 500px; overflow-y: auto; }
        .signal-item { background: #1a1f3a; padding: 12px; border-radius: 8px; margin-bottom: 8px; border-left: 3px solid; cursor: pointer; }
        .signal-long { border-left-color: #00d4aa; }
        .signal-short { border-left-color: #ff4757; }
        .signal-time { font-size: 11px; color: #6b7299; }
        .signal-symbol { font-weight: bold; font-size: 16px; margin: 4px 0; }
        .signal-price { font-size: 12px; color: #00d4aa; }
        .position { background: #1a1f3a; padding: 10px; border-radius: 8px; margin-bottom: 8px; }
        .position-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .position-long { color: #00d4aa; }
        .position-short { color: #ff4757; }
        button { background: #2a2f4e; border: none; color: #e0e0e0; padding: 4px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
        button:hover { background: #3a3f5e; }
        .close-btn { background: #ff4757; color: white; }
        .close-btn:hover { background: #ff6b7c; }
        .add-position { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
        .add-position input { background: #0a0e27; border: 1px solid #2a2f4e; color: #e0e0e0; padding: 6px 10px; border-radius: 6px; font-size: 12px; }
        .toast { position: fixed; bottom: 20px; right: 20px; background: #00d4aa; color: #0a0e27; padding: 12px 20px; border-radius: 8px; animation: slideIn 0.3s ease; z-index: 1000; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .flex { display: flex; justify-content: space-between; align-items: center; }
        .badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #2a2f4e; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1a1f3a; }
        ::-webkit-scrollbar-thumb { background: #2a2f4e; border-radius: 3px; }
    </style>
</head>
<body>
<div class="dashboard">
    <div class="header">
        <h1>📊 量化交易监控面板</h1>
        <div class="flex" style="gap: 15px;">
            <span id="btc-price" class="badge">BTC: --</span>
            <span id="status-badge" class="status-badge running">● 运行中</span>
        </div>
    </div>

    <div class="grid">
        <div class="card">
            <h3>📈 风控状态</h3>
            <div class="flex">
                <div><span class="metric" id="loss-count">0</span><div class="metric-label">连损次数</div></div>
                <div><span class="metric" id="pause-time">-</span><div class="metric-label">暂停剩余</div></div>
                <div><span class="metric" id="cooldown-count">0</span><div class="metric-label">冷却中</div></div>
                <div><span class="metric" id="blacklist-count">0</span><div class="metric-label">黑名单</div></div>
            </div>
        </div>
        <div class="card">
            <h3>🎯 活跃状态</h3>
            <div class="flex">
                <div><span class="metric" id="active-zones">0</span><div class="metric-label">密集区监控</div></div>
                <div><span class="metric" id="positions-count">0</span><div class="metric-label">持仓数</div></div>
                <div><span class="metric" id="signals-today">0</span><div class="metric-label">今日信号</div></div>
            </div>
        </div>
    </div>

    <div class="grid">
        <div class="card">
            <h3>🟢 持仓管理</h3>
            <div id="positions-container">暂无持仓</div>
        </div>
        <div class="card">
            <h3>🔔 信号列表</h3>
            <div id="signals-container" class="signal-list">等待信号...</div>
        </div>
    </div>
</div>

<script>
const socket = io();
let positions = {};

// 显示Toast
function showToast(msg, type = 'info') {
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = msg;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
}

// 添加持仓UI
function renderPositions() {
    const container = document.getElementById('positions-container');
    if (Object.keys(positions).length === 0) {
        container.innerHTML = '<div style="color:#6b7299; text-align:center;">暂无持仓</div>';
        return;
    }
    
    let html = '';
    for (const [sym, posList] of Object.entries(positions)) {
        posList.forEach((pos, idx) => {
            const sideClass = pos.side === 'long' ? 'position-long' : 'position-short';
            const sideText = pos.side === 'long' ? '做多' : '做空';
            html += `
                <div class="position">
                    <div class="position-header">
                        <span><strong>${sym}</strong> <span class="${sideClass}">${sideText}</span></span>
                        <span>${pos.size.toFixed(4)} 张</span>
                    </div>
                    <div class="flex" style="margin-bottom: 4px;">
                        <span>入场: ${pos.entry.toFixed(6)}</span>
                        <span>止损: ${pos.stop.toFixed(6)}</span>
                    </div>
                    <div class="flex" style="margin-bottom: 8px;">
                        <span>TP1: ${pos.tp1.toFixed(6)}</span>
                        <span>TP2: ${pos.tp2.toFixed(6)}</span>
                    </div>
                    <div class="add-position">
                        <input type="text" id="exit-price-${sym}-${idx}" placeholder="平仓价" style="width:100px;">
                        <button onclick="closePosition('${sym}', ${idx})" class="close-btn">平仓</button>
                    </div>
                </div>
            `;
        });
    }
    container.innerHTML = html;
    document.getElementById('positions-count').textContent = Object.values(positions).flat().length;
}

// 平仓
async function closePosition(sym, idx) {
    const input = document.getElementById(`exit-price-${sym}-${idx}`);
    const exitPrice = parseFloat(input.value);
    if (isNaN(exitPrice)) {
        showToast('请输入有效价格', 'error');
        return;
    }
    const res = await fetch('/api/positions/close', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({symbol: sym, idx: idx, exit_price: exitPrice})
    });
    if (res.ok) showToast(`${sym} 平仓成功`);
    fetchPositions();
}

// 获取持仓
async function fetchPositions() {
    const res = await fetch('/api/positions');
    positions = await res.json();
    renderPositions();
}

// 更新信号列表
function renderSignals(signals) {
    const container = document.getElementById('signals-container');
    if (!signals.length) {
        container.innerHTML = '<div style="color:#6b7299; text-align:center;">暂无信号</div>';
        return;
    }
    let html = '';
    signals.slice(0, 30).forEach(sig => {
        const sideClass = sig.type === 'long' ? 'signal-long' : 'signal-short';
        const sideText = sig.type === 'long' ? '🔵 做多' : '🔴 做空';
        html += `
            <div class="signal-item ${sideClass}" onclick="addFromSignal('${sig.symbol}', '${sig.type}', ${sig.entry || 0})">
                <div class="flex">
                    <span class="signal-time">${sig.timestamp}</span>
                    <span class="badge">${sig.symbol || '--'}</span>
                </div>
                <div class="signal-symbol">${sideText}</div>
                <div class="signal-price">入场: ${sig.entry || '--'}</div>
            </div>
        `;
    });
    container.innerHTML = html;
}

// 从信号添加持仓
function addFromSignal(symbol, side, entry) {
    const size = prompt('请输入仓位大小 (张/币数):', '0.01');
    if (!size) return;
    const stop = prompt('止损价:', entry * (side === 'long' ? 0.98 : 1.02));
    const tp1 = prompt('止盈1:', entry * (side === 'long' ? 1.03 : 0.97));
    const tp2 = prompt('止盈2:', entry * (side === 'long' ? 1.06 : 0.94));
    
    fetch('/api/positions/add', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            symbol: symbol,
            side: side,
            entry: entry,
            size: parseFloat(size),
            stop: parseFloat(stop),
            tp1: parseFloat(tp1),
            tp2: parseFloat(tp2)
        })
    }).then(() => {
        fetchPositions();
        showToast(`${symbol} ${side === 'long' ? '做多' : '做空'} 已添加`);
    });
}

// 更新状态
async function fetchStatus() {
    const res = await fetch('/api/status');
    const data = await res.json();
    document.getElementById('active-zones').textContent = data.active_zones;
    document.getElementById('cooldown-count').textContent = data.cooldowns;
    document.getElementById('blacklist-count').textContent = data.blacklist;
    document.getElementById('loss-count').textContent = data.loss_count;
    document.getElementById('signals-today').textContent = data.signals_today;
    document.getElementById('positions-count').textContent = data.positions;
    document.getElementById('btc-price').textContent = `BTC: ${data.btc_price?.toFixed(2) || '--'}`;
    
    if (data.pause_until > Date.now()/1000) {
        const remain = Math.ceil((data.pause_until - Date.now()/1000) / 60);
        document.getElementById('pause-time').textContent = `${remain}分钟`;
        document.getElementById('status-badge').className = 'status-badge paused';
        document.getElementById('status-badge').textContent = '⏸ 暂停中';
    } else {
        document.getElementById('pause-time').textContent = '-';
        document.getElementById('status-badge').className = 'status-badge running';
        document.getElementById('status-badge').textContent = '● 运行中';
    }
}

// WebSocket事件
socket.on('new_signal', (data) => {
    showToast(`📢 新信号: ${data.symbol} ${data.type === 'long' ? '做多' : '做空'}`, 'signal');
    fetch('/api/signals').then(res => res.json()).then(renderSignals);
    fetchStatus();
});

socket.on('position_update', () => fetchPositions());
socket.on('position_closed', (data) => {
    showToast(`平仓盈亏: ${data.pnl.toFixed(2)} USDT (${data.pnl_pct.toFixed(2)}%)`);
    fetchStatus();
});

// 初始化
async function init() {
    await fetchPositions();
    await fetchStatus();
    const res = await fetch('/api/signals');
    const signals = await res.json();
    renderSignals(signals);
    setInterval(fetchStatus, 5000);
}

init();
</script>
</body>
</html>
